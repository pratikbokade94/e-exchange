<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | E-Exchange</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-left">

        <div class="brand">
            <div class="logo">E</div>
            <span>E-Exchange</span>
        </div>

        <div class="auth-heading">
            <p class="small-title">JOIN E-EXCHANGE</p>

            <h1>
                Give your old<br>
                <span>tech a new life.</span>
            </h1>

            <p>
                Sell your unused devices or discover
                your next phone or laptop.
            </p>
        </div>

    </div>

    <div class="auth-right">

        <div class="auth-card">

            <h2>Create account</h2>

            <p class="auth-subtitle">
                Start buying and selling today
            </p>

            <form id="registerForm">

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <div id="message"></div>

                <button type="submit" class="auth-btn">
                    Create Account
                    <span>→</span>
                </button>

            </form>

            <p class="register-text">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

        </div>

    </div>

</div>

<script src="js/register.js"></script>

</body>
</html>
